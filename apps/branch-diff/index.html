<!doctype html>
<meta charset="utf-8">
<title>Branch Diff</title>
<style>
  :root{
    --added:#1a7f37; --added-bg:#dafbe1;
    --modified:#9a6700; --modified-bg:#fff8c5;
    --removed:#cf222e; --removed-bg:#ffebe9;
    --unchanged:#57606a; --unchanged-bg:#f6f8fa;
    --line:#d0d7de; --ink:#1f2328; --muted:#636c76; --accent:#0969da; --accent-bg:#ddf4ff;
  }
  *{box-sizing:border-box}
  body{font:14px system-ui,-apple-system,Segoe UI,sans-serif;margin:0;color:var(--ink);display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
  header h1{font-size:15px;margin:0;font-weight:600}
  select,input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .cmp{color:var(--muted)} .cmp b{color:var(--ink)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
  .dot{width:12px;height:12px;border-radius:3px;border:1.5px solid;flex:none}
  .dot.added{background:var(--added-bg);border-color:var(--added)}
  .dot.modified{background:var(--modified-bg);border-color:var(--modified)}
  .dot.removed{background:var(--removed-bg);border-color:var(--removed)}
  .dot.unchanged{background:var(--unchanged-bg);border-color:var(--unchanged)}
  .counts{display:flex;gap:10px;padding:6px 16px;border-bottom:1px solid var(--line);background:#fbfcfd;color:var(--muted);font-size:13px}
  .counts b{color:var(--ink)}
  #body{flex:1;display:flex;min-height:0}
  /* node list sidebar */
  #sidebar{width:240px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
  #filter{margin:8px;width:auto}
  #nodelist{list-style:none;margin:0;padding:0 0 8px;overflow:auto;flex:1}
  #nodelist li{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;cursor:pointer;border-left:4px solid transparent}
  #nodelist li:hover{background:#f3f4f6}
  #nodelist li.sel{background:var(--accent-bg)}
  #nodelist li .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #nodelist li .lc{font-size:10px;color:var(--muted);margin-left:auto;flex:none}
  #nodelist li.added{border-left-color:var(--added)}
  #nodelist li.modified{border-left-color:var(--modified)}
  #nodelist li.removed{border-left-color:var(--removed)}
  #nodelist li.removed .nm{text-decoration:line-through;color:var(--muted)}
  #nodelist li.unchanged{border-left-color:var(--unchanged)}
  .grouphdr{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px 2px}
  /* graph */
  #wrap{flex:1;overflow:auto;background:#fafbfc;position:relative}
  #msg{padding:24px 16px;color:var(--muted)}
  .edge{fill:none;stroke:var(--line);stroke-width:1.5}
  .edge.changed{stroke:#8c6d1f;stroke-width:2}
  .nodebox rect{rx:7;stroke-width:2}
  .nodebox text.name{font-weight:600;font-size:12px}
  .nodebox text.loc{font-size:10px;fill:var(--muted)}
  .nodebox.added rect{fill:var(--added-bg);stroke:var(--added)}
  .nodebox.modified rect{fill:var(--modified-bg);stroke:var(--modified)}
  .nodebox.removed rect{fill:var(--removed-bg);stroke:var(--removed)}
  .nodebox.removed text.name{text-decoration:line-through}
  .nodebox.unchanged rect{fill:var(--unchanged-bg);stroke:var(--line)}
  .nodebox{cursor:pointer}
  .nodebox.sel rect{stroke:var(--accent);stroke-width:3}
  .nodebox title{white-space:pre}
  /* column detail panel */
  #detail{width:300px;flex:none;border-left:1px solid var(--line);background:#fff;display:none;flex-direction:column}
  #detail.open{display:flex}
  #detailHdr{padding:10px 12px;border-bottom:1px solid var(--line)}
  #detailHdr .dn{font-weight:600;display:flex;align-items:center;gap:8px}
  #detailHdr .ds{font-size:12px;color:var(--muted);margin-top:3px}
  #detailHdr .x{margin-left:auto;cursor:pointer;color:var(--muted);border:none;background:none;font-size:16px}
  #colcounts{display:flex;gap:10px;font-size:12px;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);background:#fbfcfd}
  #collist{list-style:none;margin:0;padding:4px 0;overflow:auto;flex:1}
  #collist li{display:flex;align-items:center;gap:8px;padding:5px 12px;border-left:4px solid transparent;font-size:13px}
  #collist li .ct{font-size:11px;color:var(--muted);margin-left:auto}
  #collist li.added{border-left-color:var(--added);background:color-mix(in srgb,var(--added-bg) 55%,#fff)}
  #collist li.modified{border-left-color:var(--modified);background:color-mix(in srgb,var(--modified-bg) 55%,#fff)}
  #collist li.removed{border-left-color:var(--removed);background:color-mix(in srgb,var(--removed-bg) 55%,#fff)}
  #collist li.removed .cn{text-decoration:line-through;color:var(--muted)}
  #collist li.unchanged{border-left-color:var(--unchanged)}
  .hint{padding:16px 12px;color:var(--muted);font-size:13px}
</style>

<header>
  <h1>Branch Diff</h1>
  <span class="cmp">on <b id="current">…</b> vs</span>
  <select id="branch"><option>loading…</option></select>
  <div class="legend">
    <span><i class="dot added"></i>added</span>
    <span><i class="dot modified"></i>modified</span>
    <span><i class="dot removed"></i>removed</span>
    <span><i class="dot unchanged"></i>unchanged</span>
  </div>
</header>
<div class="counts" id="counts"></div>
<div id="body">
  <aside id="sidebar">
    <input id="filter" placeholder="Filter nodes…">
    <ul id="nodelist"><li class="hint" style="border:0">Pick a branch to compare.</li></ul>
  </aside>
  <div id="wrap"><div id="msg">Pick a branch to compare.</div></div>
  <aside id="detail">
    <div id="detailHdr"></div>
    <div id="colcounts"></div>
    <ul id="collist"></ul>
  </aside>
</div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const COL_W = 230, ROW_H = 64, BOX_W = 180, BOX_H = 44, PAD = 30;
const $ = (id) => document.getElementById(id);
const S = { compare:"", nodes:[], selFile:null };

async function loadBranches(){
  const { current, branches } = await (await fetch("api/branches")).json();
  $("current").textContent = current;
  const sel = $("branch"); sel.innerHTML = "";
  const def = document.createElement("option"); def.value=""; def.textContent="— select a branch —"; sel.append(def);
  for (const b of branches){ if (b===current) continue;
    const o=document.createElement("option"); o.value=b; o.textContent=b; sel.append(o); }
  sel.onchange = () => sel.value ? render(sel.value) : clear("Pick a branch to compare.");
}

function clear(text){
  $("counts").textContent = "";
  $("wrap").innerHTML = '<div id="msg">'+text+'</div>';
  $("nodelist").innerHTML = '<li class="hint" style="border:0">'+text+'</li>';
  closeDetail();
}

// Longest-path layering so upstream sits left of downstream.
function assignDepths(nodes, edges){
  const incoming = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) if (incoming.has(e.to)) incoming.get(e.to).push(e.from);
  const depth = new Map(), visiting = new Set();
  function d(id){
    if (depth.has(id)) return depth.get(id);
    if (visiting.has(id)) return 0;
    visiting.add(id);
    let best = 0; for (const p of incoming.get(id)||[]) best = Math.max(best, d(p)+1);
    visiting.delete(id); depth.set(id, best); return best;
  }
  for (const n of nodes) d(n.id);
  return depth;
}

async function render(compare){
  S.compare = compare; S.selFile = null; closeDetail();
  clearBusy();
  const data = await (await fetch("api/graph?compare=" + encodeURIComponent(compare))).json();
  if (data.error){ clear("Error: " + data.error); return; }
  const { nodes, edges } = data;
  if (!nodes.length){ clear("No nodes found in this workspace."); return; }
  S.nodes = nodes;

  const tally = { added:0, modified:0, removed:0, unchanged:0 };
  for (const n of nodes) tally[n.status] = (tally[n.status]||0) + 1;
  $("counts").innerHTML =
    `<span><b>${tally.added}</b> added</span>`+
    `<span><b>${tally.modified}</b> modified</span>`+
    `<span><b>${tally.removed}</b> removed</span>`+
    `<span><b>${tally.unchanged}</b> unchanged</span>`+
    `<span style="margin-left:auto"><b>${nodes.length}</b> nodes · <b>${edges.length}</b> edges</span>`;

  renderList(nodes);
  renderGraph(nodes, edges);
}
function clearBusy(){ $("wrap").innerHTML = '<div id="msg">Loading…</div>'; }

// ---- decorated node list ----
const RANK = { added:0, modified:1, removed:2, unchanged:3 };
function renderList(nodes){
  const ul = $("nodelist"); ul.innerHTML = "";
  const q = $("filter").value.trim().toLowerCase();
  const shown = nodes.filter(n => !q || n.id.toLowerCase().includes(q));
  shown.sort((a,b) => (RANK[a.status]-RANK[b.status]) || a.id.localeCompare(b.id));
  if (!shown.length){ ul.innerHTML = '<li class="hint" style="border:0">No matching nodes.</li>'; return; }
  for (const n of shown){
    const li = document.createElement("li");
    li.className = n.status + (n.file===S.selFile ? " sel" : "");
    li.title = n.id + " · " + n.status;
    const dot = document.createElement("i"); dot.className = "dot " + n.status;
    const nm = document.createElement("span"); nm.className="nm"; nm.textContent = n.name;
    const lc = document.createElement("span"); lc.className="lc"; lc.textContent = n.location;
    li.append(dot, nm, lc);
    li.onclick = () => openNode(n);
    ul.append(li);
  }
}
$("filter").oninput = () => { if (S.nodes.length) renderList(S.nodes); };

// ---- graph ----
function renderGraph(nodes, edges){
  const depth = assignDepths(nodes, edges);
  const cols = new Map();
  for (const n of nodes){ const d=depth.get(n.id)||0; if(!cols.has(d)) cols.set(d,[]); cols.get(d).push(n); }
  const pos = new Map(); let maxRows = 0;
  for (const [d, list] of cols){
    list.sort((a,b)=>(a.location+a.name).localeCompare(b.location+b.name));
    list.forEach((n,i)=> pos.set(n.id, { x:PAD+d*COL_W, y:PAD+i*ROW_H }));
    maxRows = Math.max(maxRows, list.length);
  }
  const maxDepth = Math.max(0, ...[...cols.keys()]);
  const W = PAD*2 + maxDepth*COL_W + BOX_W, H = PAD*2 + Math.max(1,maxRows)*ROW_H;

  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = '<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">'+
    '<path d="M0,0 L8,4 L0,8 z" fill="#8a94a0"/></marker></defs>';

  const byId = new Map(nodes.map(n=>[n.id,n]));
  for (const e of edges){
    const a=pos.get(e.from), b=pos.get(e.to); if(!a||!b) continue;
    const x1=a.x+BOX_W, y1=a.y+BOX_H/2, x2=b.x, y2=b.y+BOX_H/2, mx=(x1+x2)/2;
    const path=document.createElementNS(SVGNS,"path");
    path.setAttribute("d",`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    const changed = ["added","modified","removed"].includes(byId.get(e.to)?.status) ||
                    ["added","modified","removed"].includes(byId.get(e.from)?.status);
    path.setAttribute("class","edge"+(changed?" changed":"")); path.setAttribute("marker-end","url(#arr)");
    svg.append(path);
  }
  for (const n of nodes){
    const p=pos.get(n.id);
    const g=document.createElementNS(SVGNS,"g");
    g.setAttribute("class","nodebox "+n.status+(n.file===S.selFile?" sel":""));
    g.setAttribute("transform",`translate(${p.x},${p.y})`); g.dataset.file=n.file;
    const rect=document.createElementNS(SVGNS,"rect"); rect.setAttribute("width",BOX_W); rect.setAttribute("height",BOX_H); rect.setAttribute("rx",7);
    const loc=document.createElementNS(SVGNS,"text"); loc.setAttribute("class","loc"); loc.setAttribute("x",12); loc.setAttribute("y",17);
    loc.textContent=n.location+"  ·  "+n.status;
    const nm=document.createElementNS(SVGNS,"text"); nm.setAttribute("class","name"); nm.setAttribute("x",12); nm.setAttribute("y",33);
    nm.textContent=n.name.length>24?n.name.slice(0,23)+"…":n.name;
    const tip=document.createElementNS(SVGNS,"title"); tip.textContent=n.id+"\n"+n.file+"\n"+n.status+"\n(double-click to open columns)";
    g.append(rect,loc,nm,tip);
    g.addEventListener("dblclick",()=>openNode(n));   // open node for editing
    svg.append(g);
  }
  const wrap=$("wrap"); wrap.innerHTML=""; wrap.append(svg);
  highlightGraph();
}

// ---- selection + column detail ("editing a node") ----
function highlightGraph(){
  document.querySelectorAll(".nodebox").forEach(g=>g.classList.toggle("sel", g.dataset.file===S.selFile));
  document.querySelectorAll("#nodelist li").forEach(li=>{});
}
async function openNode(n){
  S.selFile = n.file;
  renderList(S.nodes); highlightGraph();
  const d=$("detail"); d.classList.add("open");
  $("detailHdr").innerHTML = `<div class="dn"><i class="dot ${n.status}"></i>${n.name}`+
    `<button class="x" title="Close">✕</button></div>`+
    `<div class="ds">${n.location} · ${n.status}</div>`;
  $("detailHdr").querySelector(".x").onclick = closeDetail;
  $("colcounts").textContent = "Loading columns…"; $("collist").innerHTML = "";
  const info = await (await fetch(`api/node?file=${encodeURIComponent(n.file)}&compare=${encodeURIComponent(S.compare)}`)).json();
  if (info.error){ $("colcounts").textContent = "Error: "+info.error; return; }
  renderColumns(info);
}
function renderColumns(info){
  const cl=$("collist"); cl.innerHTML="";
  if(!info.hasColumns){
    $("colcounts").textContent = "";
    cl.innerHTML = '<li class="hint" style="border:0">No column metadata for this node (e.g. a V2 SQL node). File status: '+(info.status||"—")+'.</li>';
    return;
  }
  const t={added:0,modified:0,removed:0,unchanged:0};
  for(const c of info.columns) t[c.status]++;
  $("colcounts").innerHTML =
    `<span><b style="color:var(--added)">${t.added}</b> added</span>`+
    `<span><b style="color:var(--modified)">${t.modified}</b> mod</span>`+
    `<span><b style="color:var(--removed)">${t.removed}</b> removed</span>`+
    `<span style="margin-left:auto">${info.columns.length} cols</span>`;
  for(const c of info.columns){
    const li=document.createElement("li"); li.className=c.status;
    const dot=document.createElement("i"); dot.className="dot "+c.status;
    const cn=document.createElement("span"); cn.className="cn"; cn.textContent=c.name;
    const ct=document.createElement("span"); ct.className="ct"; ct.textContent=c.dataType||"";
    li.append(dot,cn,ct); cl.append(li);
  }
}
function closeDetail(){ S.selFile=null; $("detail").classList.remove("open");
  if(S.nodes.length){ renderList(S.nodes); highlightGraph(); } }

loadBranches().catch(e => clear("Error loading branches: " + e));
</script>
